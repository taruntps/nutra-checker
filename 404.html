<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Page not found — Regulyze</title>
<link rel="icon" type="image/png" href="/design-system/assets/logo-mark.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--teal:#0F7A6A;--teal-d:#093A31;--ink:#16241F;--muted:#6A7168;--cream:#F7F4EC;--line:#E2DCCB}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
.brand{display:inline-flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:600;font-size:22px;margin-bottom:28px}
.brand img{width:38px;height:38px}
h1{font-family:'Fraunces',serif;font-size:clamp(48px,12vw,96px);font-weight:600;color:var(--teal-d);line-height:1}
h2{font-family:'Fraunces',serif;font-size:24px;font-weight:600;margin:10px 0 12px}
p{color:var(--muted);font-size:16px;max-width:440px;margin:0 auto 28px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;padding:13px 24px;border-radius:999px;text-decoration:none;transition:.2s}
.btn-primary{background:var(--teal);color:#fff}.btn-primary:hover{background:var(--teal-d)}
.btn-outline{background:transparent;color:var(--teal-d);border:1px solid var(--teal-d)}.btn-outline:hover{background:var(--teal-d);color:#fff}
</style>
</head>
<body>
<main>
  <a class="brand" href="/"><img src="/design-system/assets/logo-mark.png" alt="Regulyze"> Regulyze</a>
  <h1>404</h1>
  <h2>Page not found</h2>
  <p>The page you're looking for doesn't exist or may have moved.</p>
  <div class="actions">
    <a class="btn btn-primary" href="/">← Back to home</a>
    <a class="btn btn-outline" href="/app/">Open the app</a>
  </div>
</main>
</body>
</html>
