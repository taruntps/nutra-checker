name: Ingredient Data Pipeline (Phase 2.0)

# Manual only. Generates data/ingredients.json + the normalization report and
# opens a REVIEW PR. It never renders pages and never deploys automatically.
on:
  workflow_dispatch:
  # Optional future cadence (left off so nothing runs unattended):
  # schedule: [{ cron: "0 3 * * 1" }]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate normalized ingredient dataset
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node build/generate.mjs

      - name: Publish dataset to review branch
        run: |
          git config user.name "regulyze-bot"
          git config user.email "bot@regulyze.in"
          git checkout -B data/ingredients-refresh
          git add -f data/ingredients.json data/NORMALIZATION-REPORT.md
          git commit -m "data: refresh normalized ingredient dataset (Phase 2.0)" || echo "no changes"
          git push -f origin data/ingredients-refresh
