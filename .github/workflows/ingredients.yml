name: Ingredient Data Pipeline (Phase 2.0)

# Manual only. Generates data/ingredients.json + the normalization report and
# opens a REVIEW PR. It never renders pages and never deploys automatically.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Comma-separated categories to render (blank = all live categories)"
        required: false
        default: "vitamin,mineral,amino-acid,probiotic,prebiotic"
  # Optional future cadence (left off so nothing runs unattended):
  # schedule: [{ cron: "0 3 * * 1" }]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate dataset + render published categories
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PUBLISH: ${{ inputs.publish }}
        run: node build/generate.mjs

      - name: Publish to review branch
        run: |
          git config user.name "regulyze-bot"
          git config user.email "bot@regulyze.in"
          git checkout -B data/ingredients-refresh
          git add -f data/ingredients.json data/NORMALIZATION-REPORT.md sitemap.xml ingredients/
          git commit -m "build: ingredient dataset + rendered pages (Phase 2.1)" || echo "no changes"
          git push -f origin data/ingredients-refresh
