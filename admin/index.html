<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Regulyze — Admin Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.1.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0E1F3C;--navy2:#1E3A5F;--blue:#235690;--ink:#11161F;--muted:#566; --line:#E5E9F0;--bg:#F5F8FB;
  --ok:#0F9D58;--okbg:#E6F4EA;--warn:#B45309;--warnbg:#FEF3C7;--fail:#C0392B;--failbg:#FDECEA}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
a{color:var(--blue);text-decoration:none}
.mono{font-family:'DM Mono',monospace}
header{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:14px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
header b{font-size:18px;font-weight:800}
header .sp{margin-left:auto;display:flex;gap:12px;align-items:center;font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:8px;padding:8px 14px;font:600 13px Manrope,sans-serif;cursor:pointer;background:var(--navy2);color:#fff}
.btn:hover{background:var(--blue)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:6px}
.btn.gho{background:#fff;color:var(--navy2);border:1px solid var(--line)}
.btn.gho:hover{background:var(--bg)}
.btn.danger{background:var(--fail)}
.wrap{max-width:1280px;margin:0 auto;padding:20px 24px 60px}
.tabs{display:flex;gap:6px;margin-bottom:18px}
.tab{padding:9px 16px;border-radius:8px;background:#fff;border:1px solid var(--line);cursor:pointer;font-weight:600;color:var(--muted)}
.tab.on{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.toolbar{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.toolbar input,.toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg);text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#FAFCFE}
.pill{display:inline-block;padding:2px 9px;border-radius:30px;font-size:11px;font-weight:700}
.p-ok{background:var(--okbg);color:var(--ok)} .p-warn{background:var(--warnbg);color:var(--warn)} .p-fail{background:var(--failbg);color:var(--fail)} .p-mut{background:#EEF1F5;color:#667}
select.mini{padding:4px 6px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:12px}
.muted{color:var(--muted)}
.right{text-align:right}
.center{text-align:center}
/* login + gate */
.gate{max-width:380px;margin:8vh auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px}
.gate h2{font-size:18px;margin-bottom:4px}.gate p{color:var(--muted);font-size:13px;margin-bottom:18px}
.fld{margin-bottom:12px}.fld label{display:block;font-size:12px;font-weight:600;margin-bottom:5px}
.fld input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font:inherit}
.err{color:var(--fail);font-size:12px;margin-top:8px;min-height:16px}
.modal-bg{position:fixed;inset:0;background:rgba(14,31,60,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:14px;max-width:680px;width:100%;max-height:85vh;overflow:auto;padding:22px}
.modal h3{margin-bottom:12px;display:flex;align-items:center;gap:8px}
.modal .x{margin-left:auto;cursor:pointer;color:var(--muted)}
.kv{display:flex;gap:10px;padding:6px 0;font-size:13px;border-bottom:1px solid var(--line)}
.kv b{min-width:130px;color:var(--muted);font-weight:600}
.add-row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:end}
.add-row label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px}
.add-row input,.add-row select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:12px}
@media(max-width:760px){.add-row{grid-template-columns:1fr 1fr}}
.hide{display:none}
</style>
</head>
<body>

<!-- LOGIN GATE -->
<div id="gate" class="gate hide">
  <h2>Admin Console</h2>
  <p>Sign in with an admin account.</p>
  <div class="fld"><label>Email or username</label><input id="g-user" type="text" placeholder="Email or username"></div>
  <div class="fld"><label>Password</label><input id="g-pass" type="password" placeholder="Password"></div>
  <button class="btn" style="width:100%;justify-content:center" onclick="adminLogin()"><i class="ti ti-login"></i> Sign In</button>
  <div class="err" id="g-err"></div>
</div>

<!-- DENIED -->
<div id="denied" class="gate hide">
  <h2>Access denied</h2>
  <p>This account is not an administrator.</p>
  <button class="btn gho" style="width:100%;justify-content:center" onclick="doLogout()">Sign out</button>
</div>

<!-- CONSOLE -->
<div id="console" class="hide">
  <header>
    <i class="ti ti-shield-lock" style="font-size:22px"></i>
    <b>Regulyze Admin</b>
    <div class="sp"><span id="whoami" class="muted"></span> <a href="../" style="color:#cfe0f5">↗ App</a> <button class="btn sm gho" onclick="doLogout()">Sign out</button></div>
  </header>
  <div class="wrap">
    <div class="tabs">
      <div class="tab on" data-pane="users" onclick="showPane('users',this)"><i class="ti ti-users"></i> Users</div>
      <div class="tab" data-pane="activity" onclick="showPane('activity',this)"><i class="ti ti-history"></i> Activity</div>
      <div class="tab" data-pane="coupons" onclick="showPane('coupons',this)"><i class="ti ti-ticket"></i> Coupons</div>
    </div>

    <!-- USERS -->
    <div id="pane-users" class="card">
      <div class="toolbar">
        <input id="u-search" placeholder="Search name / email / username…" oninput="renderUsers()" style="flex:1;min-width:200px">
        <button class="btn sm" onclick="openAddUser()"><i class="ti ti-user-plus"></i> Add user</button>
        <button class="btn sm gho" onclick="loadUsers()"><i class="ti ti-refresh"></i> Refresh</button>
        <span class="muted" id="u-count"></span>
      </div>
      <div style="overflow:auto"><table id="u-table"><thead>
        <tr><th>User</th><th>Username</th><th>Plan</th><th>Checks</th><th>Expiry</th><th>Status</th><th>Login</th><th>Last active</th><th></th></tr>
      </thead><tbody id="u-body"></tbody></table></div>
    </div>

    <!-- ACTIVITY -->
    <div id="pane-activity" class="card hide">
      <div class="toolbar">
        <input id="a-search" placeholder="Search email / event…" oninput="renderActivity()" style="flex:1;min-width:200px">
        <button class="btn sm gho" onclick="loadActivity()"><i class="ti ti-refresh"></i> Refresh</button>
        <span class="muted" id="a-count"></span>
      </div>
      <div style="overflow:auto"><table><thead>
        <tr><th>When</th><th>User</th><th>Event</th><th>Detail</th><th>Status</th></tr>
      </thead><tbody id="a-body"></tbody></table></div>
    </div>

    <!-- COUPONS -->
    <div id="pane-coupons" class="card hide">
      <div class="add-row">
        <div><label>Code</label><input id="c-code" placeholder="DIWALI30"></div>
        <div><label>Kind</label><select id="c-kind"><option value="discount">discount</option><option value="grant">grant</option></select></div>
        <div><label>Plan (grant)</label><select id="c-plan"><option value="">—</option><option>basic</option><option>pro</option><option>monthly</option><option>unlimited</option><option>enterprise</option></select></div>
        <div><label>Discount type</label><select id="c-dtype"><option value="percent">percent</option><option value="flat">flat ₹</option></select></div>
        <div><label>Value</label><input id="c-val" type="number" placeholder="20"></div>
        <div><button class="btn" style="width:100%;justify-content:center" onclick="addCoupon()"><i class="ti ti-plus"></i> Add</button></div>
      </div>
      <div class="toolbar"><button class="btn sm gho" onclick="loadCoupons()"><i class="ti ti-refresh"></i> Refresh</button><span class="muted" id="c-count"></span><span class="err" id="c-err" style="margin:0"></span></div>
      <div style="overflow:auto"><table><thead>
        <tr><th>Code</th><th>Kind</th><th>Plan / Discount</th><th>Assigned</th><th>Uses</th><th>Status</th><th></th></tr>
      </thead><tbody id="c-body"></tbody></table></div>
    </div>
  </div>
</div>

<!-- ADD USER MODAL -->
<div class="modal-bg" id="addmodal"><div class="modal" style="max-width:520px">
  <h3><i class="ti ti-user-plus"></i> Add user <i class="ti ti-x x" onclick="closeAdd()"></i></h3>
  <div class="fld"><label>Email *</label><input id="au-email" type="email" placeholder="person@company.com"></div>
  <div class="fld"><label>Password *</label><input id="au-pass" type="text" placeholder="min 6 characters (visible to admin)"></div>
  <div class="fld"><label>Name</label><input id="au-name" type="text"></div>
  <div class="fld"><label>Username (optional — for short login like &quot;anjali&quot;)</label><input id="au-username" type="text"></div>
  <div style="display:flex;gap:10px">
    <div class="fld" style="flex:1"><label>Plan</label><select id="au-plan"><option>free</option><option>basic</option><option>pro</option><option>monthly</option><option>unlimited</option><option>enterprise</option></select></div>
    <div class="fld" style="flex:1"><label>Mobile</label><input id="au-mobile" type="text"></div>
  </div>
  <div class="fld"><label>Company</label><input id="au-company" type="text"></div>
  <button class="btn" style="width:100%;justify-content:center" onclick="submitAddUser()"><i class="ti ti-check"></i> Create user</button>
  <div class="err" id="au-err"></div>
</div></div>

<!-- USER DETAIL MODAL -->
<div class="modal-bg" id="umodal"><div class="modal">
  <h3><i class="ti ti-user"></i> <span id="m-name"></span> <i class="ti ti-x x" onclick="closeModal()"></i></h3>
  <div id="m-info"></div>
  <h3 style="margin-top:18px;font-size:15px"><i class="ti ti-history"></i> History</h3>
  <div id="m-hist" class="muted">Loading…</div>
</div></div>

<script>
const SUPA_URL='https://afttrokqchfcpjcekuyh.supabase.co';
const SUPA_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmdHRyb2txY2hmY3BqY2VrdXloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2OTM2NzgsImV4cCI6MjA5NzI2OTY3OH0.JGL-oFajC4PWLcvqOhPCSOywUIgYw5Vz6V7u5kCuU9Q';
const SB=supabase.createClient(SUPA_URL,SUPA_ANON,{auth:{persistSession:true,autoRefreshToken:true}});
const PLANS={free:5,basic:10,pro:50,monthly:500,unlimited:99999,enterprise:99999};
const VALID_DAYS={monthly:30,unlimited:180};
let USERS=[], ACTS=[], COUPS=[];
const $=id=>document.getElementById(id);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fdate=s=>s?new Date(s).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'—';
const fday=s=>s?new Date(s).toLocaleDateString('en-IN',{dateStyle:'medium'}):'never';

function show(el){['gate','denied','console'].forEach(x=>$(x).classList.add('hide'));$(el).classList.remove('hide');}

async function boot(){
  const {data}=await SB.auth.getSession();
  if(!data.session){ show('gate'); return; }
  await afterAuth();
}
async function adminLogin(){
  const err=$('g-err'); err.textContent='';
  let u=($('g-user').value||'').trim().toLowerCase(); const p=($('g-pass').value||'').trim();
  if(!u||!p){ err.textContent='Enter email/username and password.'; return; }
  let email=u;
  if(u.indexOf('@')<0){ try{const r=await SB.rpc('resolve_login',{p_login:u}); if(!r.error&&r.data)email=r.data;}catch(e){} }
  if(email.indexOf('@')<0){ err.textContent='Unknown username.'; return; }
  const {error}=await SB.auth.signInWithPassword({email,password:p});
  if(error){ err.textContent='Login failed: '+error.message; return; }
  await afterAuth();
}
async function afterAuth(){
  const {data:{user}}=await SB.auth.getUser();
  const {data:prof}=await SB.from('profiles').select('email,name,is_admin').eq('id',user.id).single();
  if(!prof||!prof.is_admin){ show('denied'); return; }
  $('whoami').textContent=(prof.name||prof.email)+' · admin';
  show('console');
  loadUsers(); loadActivity(); loadCoupons();
}
async function doLogout(){ await SB.auth.signOut(); location.reload(); }

function showPane(p,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on')); el.classList.add('on');
  ['users','activity','coupons'].forEach(x=>$('pane-'+x).classList.add('hide'));
  $('pane-'+p).classList.remove('hide');
}

/* ---------- USERS ---------- */
async function loadUsers(){
  const {data,error}=await SB.from('profiles').select('*').order('created_at',{ascending:false});
  if(error){ $('u-body').innerHTML='<tr><td colspan="9" class="center">'+esc(error.message)+'</td></tr>'; return; }
  USERS=data||[]; renderUsers();
}
function renderUsers(){
  const q=($('u-search').value||'').toLowerCase();
  const rows=USERS.filter(u=>!q||[(u.email||''),(u.name||''),(u.username||'')].join(' ').toLowerCase().includes(q));
  $('u-count').textContent=rows.length+' users';
  $('u-body').innerHTML=rows.map(u=>{
    const unl=u.plan_checks>=9999||['unlimited','enterprise'].includes(u.plan);
    const checks=unl?'∞':((u.used||0)+' / '+(u.plan_checks||0));
    const exp=u.plan_expires_at?fday(u.plan_expires_at):'—';
    const st=u.status==='active'?'<span class="pill p-ok">active</span>':'<span class="pill p-fail">'+esc(u.status||'—')+'</span>';
    const am=u.auth_method==='google'?'<span class="pill p-mut">Google</span>':'<span class="pill p-mut">password</span>';
    const planSel='<select class="mini" onchange="setPlan(\''+u.id+'\',this.value)">'+Object.keys(PLANS).map(p=>'<option '+(p===u.plan?'selected':'')+'>'+p+'</option>').join('')+'</select>';
    return '<tr>'+
      '<td><b>'+esc(u.name||'—')+'</b><div class="muted mono" style="font-size:11px">'+esc(u.email||'')+'</div></td>'+
      '<td>'+(u.username?'<span class="pill p-mut">'+esc(u.username)+'</span>':'—')+'</td>'+
      '<td>'+planSel+'</td>'+
      '<td class="mono">'+checks+'</td>'+
      '<td>'+exp+'</td>'+
      '<td>'+st+'</td>'+
      '<td>'+am+'</td>'+
      '<td class="muted" style="font-size:11px">'+fdate(u.last_active_at)+'</td>'+
      '<td class="right" style="white-space:nowrap">'+
        '<button class="btn sm gho" title="Details / history" onclick="openUser(\''+u.id+'\')"><i class="ti ti-eye"></i></button> '+
        '<button class="btn sm gho" title="Force logout (all devices)" onclick="forceLogout(\''+u.id+'\')"><i class="ti ti-logout"></i></button> '+
        (u.status==='active'
          ?'<button class="btn sm danger" title="Suspend" onclick="setStatus(\''+u.id+'\',\'suspended\')"><i class="ti ti-ban"></i></button>'
          :'<button class="btn sm" title="Re-activate" onclick="setStatus(\''+u.id+'\',\'active\')"><i class="ti ti-check"></i></button>')+
      '</td></tr>';
  }).join('')||'<tr><td colspan="9" class="center muted">No users</td></tr>';
}
async function setPlan(id,plan){
  const checks=PLANS[plan]||5;
  const upd={plan,plan_checks:checks,used:0};
  upd.plan_expires_at = VALID_DAYS[plan] ? new Date(Date.now()+VALID_DAYS[plan]*864e5).toISOString() : null;
  const {error}=await SB.from('profiles').update(upd).eq('id',id);
  if(error)alert('Failed: '+error.message); else loadUsers();
}
async function setStatus(id,status){
  const {error}=await SB.from('profiles').update({status}).eq('id',id);
  if(error)alert('Failed: '+error.message); else loadUsers();
}
async function forceLogout(id){
  if(!confirm('Force logout this user from ALL devices?'))return;
  const r=await SB.rpc('admin_force_logout',{p_user:id});
  if(r.error||(r.data&&r.data.error))alert('Failed: '+((r.error&&r.error.message)||'forbidden'));
  else alert('Done — the user will be signed out on their next action.');
}
async function openUser(id){
  const u=USERS.find(x=>x.id===id); if(!u)return;
  $('m-name').textContent=u.name||u.email;
  let cred=null; try{const r=await SB.rpc('admin_get_credential',{p_user:id}); if(!r.error)cred=r.data;}catch(e){}
  let devs=[]; try{const dr=await SB.from('sessions').select('*').eq('user_id',id).order('last_seen',{ascending:false}); devs=dr.data||[];}catch(e){}
  const pw = !cred?'—' : (cred.auth_method==='google'||cred.plain_password==='__GOOGLE_OAUTH__'?'<span class="pill p-mut">Google sign-in (no password)</span>':'<span class="mono">'+esc(cred.plain_password||'—')+'</span>');
  $('m-info').innerHTML=
    '<div class="kv"><b>Email</b><span class="mono">'+esc(u.email||'')+'</span></div>'+
    '<div class="kv"><b>Username</b>'+esc(u.username||'—')+'</div>'+
    '<div class="kv"><b>Company / Mobile</b>'+esc(u.company||'—')+' · '+esc(u.mobile||'—')+'</div>'+
    '<div class="kv"><b>Plan</b>'+esc(u.plan||'')+' · '+(u.used||0)+'/'+(u.plan_checks||0)+' · expires '+fday(u.plan_expires_at)+'</div>'+
    '<div class="kv"><b>Password (admin)</b>'+pw+'</div>'+
    '<div class="kv"><b>Active devices ('+devs.length+'/2)</b>'+(devs.length?devs.map(d=>esc((d.label||'device').slice(0,46))+' · '+fdate(d.last_seen)).join('<br>'):'—')+'</div>'+
    '<div class="kv"><b>Created</b>'+fdate(u.created_at)+'</div>';
  $('m-hist').innerHTML='Loading…';
  $('umodal').classList.add('on');
  const {data:h}=await SB.from('history').select('*').eq('user_id',id).order('created_at',{ascending:false}).limit(100);
  $('m-hist').innerHTML=(h&&h.length)?'<table><thead><tr><th>When</th><th>Formula</th><th>Category</th></tr></thead><tbody>'+
    h.map(x=>'<tr><td class="muted" style="font-size:11px;white-space:nowrap">'+fdate(x.created_at)+'</td><td class="mono" style="font-size:11px;white-space:pre-wrap">'+esc((x.formula||'').slice(0,300))+'</td><td>'+esc(x.category||x.summary||'')+'</td></tr>').join('')+'</tbody></table>'
    :'<span class="muted">No checks yet.</span>';
}
function closeModal(){ $('umodal').classList.remove('on'); }

/* ---------- ACTIVITY ---------- */
async function loadActivity(){
  const {data,error}=await SB.from('activity').select('*').order('created_at',{ascending:false}).limit(300);
  if(error){ $('a-body').innerHTML='<tr><td colspan="5" class="center">'+esc(error.message)+'</td></tr>'; return; }
  ACTS=data||[]; renderActivity();
}
function renderActivity(){
  const q=($('a-search').value||'').toLowerCase();
  const rows=ACTS.filter(a=>!q||[(a.email||''),(a.event||''),(a.detail||'')].join(' ').toLowerCase().includes(q));
  $('a-count').textContent=rows.length+' events';
  $('a-body').innerHTML=rows.map(a=>'<tr>'+
    '<td class="muted" style="font-size:11px;white-space:nowrap">'+fdate(a.created_at)+'</td>'+
    '<td>'+esc(a.name||'')+'<div class="muted mono" style="font-size:11px">'+esc(a.email||'')+'</div></td>'+
    '<td><span class="pill p-mut">'+esc(a.event||'')+'</span></td>'+
    '<td class="muted">'+esc(a.detail||'')+'</td>'+
    '<td>'+esc(a.status||'')+'</td></tr>').join('')||'<tr><td colspan="5" class="center muted">No activity</td></tr>';
}

/* ---------- COUPONS ---------- */
async function loadCoupons(){
  const {data,error}=await SB.from('coupons').select('*').order('created_at',{ascending:false});
  if(error){ $('c-body').innerHTML='<tr><td colspan="7" class="center">'+esc(error.message)+'</td></tr>'; return; }
  COUPS=data||[]; renderCoupons();
}
function renderCoupons(){
  $('c-count').textContent=COUPS.length+' coupons';
  $('c-body').innerHTML=COUPS.map(c=>{
    const what=c.kind==='grant'?('grant → '+esc(c.plan||'')+(c.checks_to_add?(' ('+c.checks_to_add+' checks)'):''))
      :((c.discount_type==='percent'?(c.discount_value+'% off'):('₹'+c.discount_value+' off'))+(c.applies_to_plan&&c.applies_to_plan!=='all'?(' · '+c.applies_to_plan):''));
    const st=c.status==='active'?'<span class="pill p-ok">active</span>':'<span class="pill p-mut">'+esc(c.status)+'</span>';
    return '<tr><td class="mono"><b>'+esc(c.code)+'</b></td><td>'+esc(c.kind)+'</td><td>'+what+'</td>'+
      '<td>'+esc(c.assigned_to||'anyone')+'</td><td class="mono">'+(c.used_count||0)+(c.max_uses?('/'+c.max_uses):'')+'</td><td>'+st+'</td>'+
      '<td class="right">'+(c.status==='active'
        ?'<button class="btn sm gho" onclick="setCoupon(\''+esc(c.code)+'\',\'disabled\')">Disable</button>'
        :'<button class="btn sm gho" onclick="setCoupon(\''+esc(c.code)+'\',\'active\')">Enable</button>')+
      ' <button class="btn sm danger" onclick="delCoupon(\''+esc(c.code)+'\')"><i class="ti ti-trash"></i></button></td></tr>';
  }).join('')||'<tr><td colspan="7" class="center muted">No coupons</td></tr>';
}
async function addCoupon(){
  const err=$('c-err'); err.textContent='';
  const code=($('c-code').value||'').trim().toUpperCase();
  if(!code){ err.textContent='Enter a code.'; return; }
  const kind=$('c-kind').value;
  const row={code,kind,status:'active'};
  if(kind==='grant'){ row.plan=$('c-plan').value||'unlimited'; row.checks_to_add=PLANS[row.plan]||99999; row.valid_days=VALID_DAYS[row.plan]||null; }
  else { row.discount_type=$('c-dtype').value; row.discount_value=parseFloat($('c-val').value||'0')||0; row.applies_to_plan='all'; }
  const {error}=await SB.from('coupons').insert(row);
  if(error){ err.textContent=error.message; return; }
  $('c-code').value=''; $('c-val').value=''; loadCoupons();
}
async function setCoupon(code,status){ const {error}=await SB.from('coupons').update({status}).eq('code',code); if(error)alert(error.message); else loadCoupons(); }
async function delCoupon(code){ if(!confirm('Delete coupon '+code+'?'))return; const {error}=await SB.from('coupons').delete().eq('code',code); if(error)alert(error.message); else loadCoupons(); }

function openAddUser(){ ['au-email','au-pass','au-name','au-username','au-mobile','au-company'].forEach(function(i){var e=$(i);if(e)e.value='';}); $('au-plan').value='free'; $('au-err').textContent=''; $('addmodal').classList.add('on'); }
function closeAdd(){ $('addmodal').classList.remove('on'); }
async function submitAddUser(){
  const err=$('au-err'); err.textContent='';
  const email=($('au-email').value||'').trim().toLowerCase(), pass=($('au-pass').value||'').trim();
  if(!email||!pass){ err.style.color='#C0392B'; err.textContent='Email and password are required.'; return; }
  if(pass.length<6){ err.style.color='#C0392B'; err.textContent='Password must be at least 6 characters.'; return; }
  err.style.color='#566'; err.textContent='Creating…';
  const body={email:email,password:pass,name:($('au-name').value||'').trim(),username:($('au-username').value||'').trim().toLowerCase(),plan:$('au-plan').value,mobile:($('au-mobile').value||'').trim(),company:($('au-company').value||'').trim()};
  try{
    const r=await SB.functions.invoke('admin-create-user',{body:body});
    if(r.error) throw new Error((r.error&&r.error.message)||'failed');
    if(!r.data||!r.data.ok) throw new Error((r.data&&r.data.error)||'failed');
    err.style.color='#0F9D58'; err.textContent='User created!';
    setTimeout(function(){ closeAdd(); loadUsers(); },700);
  }catch(e){ err.style.color='#C0392B'; err.textContent='Failed: '+e.message; }
}
boot();
</script>
